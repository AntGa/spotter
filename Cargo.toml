[package]
name = "spotter"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
poise = "0.7.1"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "macros",
  "migrate",
  "chrono",
] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
